<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의하기 | 비하이브</title>
<meta name="description" content="교육 의뢰, 쇼츠 제작, 협업 문의를 남겨 주세요.">
<meta property="og:title" content="문의하기 | 비하이브">
<meta property="og:description" content="교육 의뢰, 쇼츠 제작, 협업 문의를 남겨 주세요.">
<meta name="theme-color" content="#e9a915">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="비하이브 홈"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 0 32 9v18L16 36 0 27V9z" fill="var(--honey)"/><path d="M16 10.5 23 14.5v7L16 25.5 9 21.5v-7z" fill="var(--charcoal)"/></svg><span>beehive <small>비하이브</small></span></a>
    <button class="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false"><i class="ph ph-list"></i></button>
    <nav class="nav-links" aria-label="주요 메뉴"><a href="index.html">홈</a><a href="education.html">교육</a><a href="studio.html">스튜디오</a><a href="about.html">소개</a><a class="btn btn-honey" href="contact.html" aria-current="page">문의하기</a></nav>
  </div>
</header>
<main>
<section class="page-hero">
  <div class="wrap">
    <h1>문의하기</h1>
    <p class="lead">교육 의뢰, 쇼츠 제작, 협업 제안 모두 편하게 남겨 주세요.</p>
  </div>
</section>

<section style="padding-top:32px">
  <div class="wrap contact-grid">
    <div class="contact-cards">
      <a class="ccard" data-contact="email"><i class="ph ph-envelope-simple"></i><div><b>이메일</b><span></span></div></a>
      <a class="ccard" data-contact="phone"><i class="ph ph-phone"></i><div><b>전화</b><span></span></div></a>
      <a class="ccard" data-contact="kakao" target="_blank" rel="noopener"><i class="ph ph-chat-circle-dots"></i><div><b>카카오톡</b><span></span></div></a>
    </div>

    <form class="form" id="inquiry" novalidate>
      <div class="row">
        <div class="field">
          <label for="f-name">이름 <span class="req">*</span></label>
          <input id="f-name" name="name" autocomplete="name" required>
          <span class="err">이름을 적어 주세요.</span>
        </div>
        <div class="field">
          <label for="f-org">소속 또는 상호</label>
          <input id="f-org" name="org" autocomplete="organization">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="f-tel">연락처 <span class="req">*</span></label>
          <input id="f-tel" name="tel" type="tel" autocomplete="tel" required>
          <span class="err">답변 받을 연락처를 적어 주세요.</span>
        </div>
        <div class="field">
          <label for="f-topic">문의 분야</label>
          <select id="f-topic" name="topic">
            <option>AI·SW 교육</option>
            <option>진로 교육</option>
            <option>교직원·임직원 연수</option>
            <option>광고 쇼츠 제작</option>
            <option>기타·협업</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-when">희망 시기</label>
        <input id="f-when" name="when">
        <span class="help">예: 11월 둘째 주, 겨울방학 중</span>
      </div>
      <div class="field">
        <label for="f-msg">문의 내용 <span class="req">*</span></label>
        <textarea id="f-msg" name="message" required></textarea>
        <span class="help">대상, 인원, 원하는 내용을 알려 주시면 더 정확히 안내해 드려요.</span>
        <span class="err">문의 내용을 적어 주세요.</span>
      </div>
      <div class="form-note" role="status"></div>
      <div><button class="btn btn-honey" type="submit">보내기 <i class="ph ph-paper-plane-tilt"></i></button></div>
    </form>
  </div>
</section>

</main>
<footer class="site-footer">
  <div class="wrap foot">
    <div>
      <div class="brand"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 0 32 9v18L16 36 0 27V9z" fill="var(--honey)"/><path d="M16 10.5 23 14.5v7L16 25.5 9 21.5v-7z" fill="var(--charcoal)"/></svg><span>beehive</span></div>
      <p>배움과 이야기를 짓는 곳, 비하이브</p>
      <p>&copy; <span data-year></span> Beehive. All rights reserved.</p>
    </div>
    <nav aria-label="바닥글 메뉴">
      <a href="education.html">교육</a><a href="studio.html">스튜디오</a><a href="about.html">소개</a><a href="contact.html">문의하기</a>
    </nav>
  </div>
</footer>
<script src="assets/site.js"></script>
</body>
</html>
